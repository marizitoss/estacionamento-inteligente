<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Estacionamento Inteligente</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<style>
  :root {
    --bg: #e9e7e2; --asphalt: #3d4247; --line: #f2efe6; --ink: #1e2327; --muted: #666d73;
    --free: #2f9e5b; --busy: #c93c3c; --pcd: #1f5fbf; --card: #f7f6f2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1d20; --asphalt: #2b2f33; --line: #d9d6cc; --ink: #ecebe6; --muted: #9aa1a7; --card: #23272b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: end; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  .modes { display: inline-flex; border: 1px solid var(--muted); border-radius: 8px; overflow: hidden; }
  .modes button { border: 0; background: transparent; color: var(--ink); padding: 8px 14px; font: inherit; font-size: .9rem; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  button:focus-visible { outline: 3px solid var(--pcd); outline-offset: 2px; }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .stat { background: var(--card); border-radius: 10px; padding: 12px 14px; }
  .stat b { display: block; font-size: 1.7rem; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: .85rem; }
  .bar { height: 6px; background: color-mix(in srgb, var(--muted) 30%, transparent); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--busy); transition: width .4s; }

  .lot { background: var(--asphalt); border-radius: 14px; padding: 22px 18px 18px; }
  .bays { display: grid; grid-template-columns: repeat(4, 1fr); }
  .bay { position: relative; border: 0; background: transparent; color: var(--line); font: inherit; cursor: default;
         border-left: 3px solid var(--line); border-right: 3px solid var(--line); margin-right: -3px; padding: 10px 6px 14px; min-height: 220px;
         display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
  .bay.sim { cursor: pointer; }
  .bay.sim:hover { background: rgba(255,255,255,.06); }
  .tag { font-weight: 700; font-size: .95rem; }
  .bay.pcd .tag { background: var(--pcd); color: #fff; border-radius: 6px; padding: 2px 10px; }
  .car { width: 70%; max-width: 110px; transition: transform .5s ease, opacity .4s; }
  .bay.free .car { transform: translateY(-70px); opacity: 0; }
  .bay.busy .car { transform: translateY(0); opacity: 1; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .9rem; background: rgba(0,0,0,.35); padding: 3px 10px; border-radius: 999px; }
  .badge::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
  .bay.free .badge { color: #6fe39a; } .bay.busy .badge { color: #ff8a8a; }
  .dist { font-size: .8rem; opacity: .8; }
  .hint { color: var(--muted); font-size: .85rem; margin: 10px 2px 0; }

  .conn { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 18px; font-size: .9rem; color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--free); } .dot.err { background: var(--busy); }
  details { margin-top: 16px; background: var(--card); border-radius: 10px; padding: 10px 14px; }
  summary { cursor: pointer; font-weight: 600; }
  pre { margin: 10px 0 0; overflow-x: auto; font-size: .8rem; line-height: 1.45; }
  @media (max-width: 560px) { .bay { min-height: 190px; padding: 8px 2px 12px; } .badge { font-size: .75rem; padding: 2px 6px; } }
  @media (prefers-reduced-motion: reduce) { .car, .bar i { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Estacionamento inteligente</h1>
      <p>Estado das vagas em tempo real</p>
    </div>
    <div class="modes" role="group" aria-label="Fonte dos dados">
      <button id="btnLive" aria-pressed="true">Ao vivo (MQTT)</button>
      <button id="btnSim" aria-pressed="false">Simulação</button>
    </div>
  </header>

  <section class="summary" aria-live="polite">
    <div class="stat"><b id="sLivres">–</b><span>vagas livres</span></div>
    <div class="stat"><b id="sPcd">–</b><span>vaga PCD</span></div>
    <div class="stat"><b id="sOcup">–</b><span>ocupação</span><div class="bar"><i id="sBar" style="width:0"></i></div></div>
  </section>

  <section class="lot" aria-label="Mapa das vagas">
    <div class="bays" id="bays"></div>
  </section>
  <p class="hint" id="hint"></p>

  <div class="conn">
    <span><i class="dot" id="dot"></i><span id="connTxt">Conectando...</span></span>
    <span id="lastTxt">Nenhuma mensagem recebida ainda</span>
  </div>

  <details>
    <summary>Último payload recebido (JSON)</summary>
    <pre id="raw">Aguardando dados...</pre>
  </details>
</main>

<script>
// ===== Configuração (mesmos valores do sketch.ino) =====
const BROKER_WS = "wss://broker.hivemq.com:8884/mqtt"; // HiveMQ público, MQTT sobre WebSocket seguro
const TOPIC     = "iot_estacionamento/vagas/status";
const LIMITE_CM = 50;                                  // mesmo limite do ESP32
const STALE_MS  = 15000;                               // sem mensagem por 15 s = aviso de dados antigos

const TIPOS = ["PCD", "COMUM", "COMUM", "COMUM"];
const $ = id => document.getElementById(id);
let mode = "live", client = null, lastMsg = 0;
let sim = [false, false, false, false];

// ===== Desenho das vagas =====
const CAR = `<svg class="car" viewBox="0 0 80 150" aria-hidden="true">
  <rect x="8" y="4" width="64" height="142" rx="20" fill="#d8dde2"/>
  <rect x="16" y="30" width="48" height="26" rx="6" fill="#39424a"/>
  <rect x="16" y="92" width="48" height="30" rx="6" fill="#39424a"/>
  <rect x="14" y="8" width="12" height="6" rx="3" fill="#ffe9a8"/><rect x="54" y="8" width="12" height="6" rx="3" fill="#ffe9a8"/>
</svg>`;
function buildBays() {
  $("bays").innerHTML = TIPOS.map((t, i) => `
    <button class="bay free ${t === "PCD" ? "pcd" : ""}" id="bay${i}" aria-label="Vaga ${i + 1}">
      <span class="tag">${t === "PCD" ? "♿ PCD" : "Vaga " + (i + 1)}</span>
      ${CAR}
      <span><span class="badge" id="badge${i}">Livre</span><div class="dist" id="dist${i}"></div></span>
    </button>`).join("");
  TIPOS.forEach((_, i) => $("bay" + i).addEventListener("click", () => {
    if (mode !== "sim") return;
    sim[i] = !sim[i]; publishSim();
  }));
}

// ===== Renderização a partir do payload (mesmo formato do ESP32) =====
function render(p) {
  const vagas = p.vagas || [];
  vagas.forEach((v, i) => {
    const busy = v.status === "OCUPADA";
    $("bay" + i).className = `bay ${busy ? "busy" : "free"} ${v.tipo === "PCD" ? "pcd" : ""} ${mode === "sim" ? "sim" : ""}`;
    $("badge" + i).textContent = busy ? "Ocupada" : "Livre";
    $("dist" + i).textContent = v.dist_cm !== undefined ? `${Number(v.dist_cm).toFixed(1)} cm` : "";
    $("bay" + i).setAttribute("aria-label", `Vaga ${v.id}, ${v.tipo}, ${busy ? "ocupada" : "livre"}`);
  });
  $("sLivres").textContent = `${p.vagas_livres} de ${p.total_vagas}`;
  $("sPcd").textContent = p.pcd_livre ? "Livre" : "Ocupada";
  $("sOcup").textContent = `${p.ocupacao_pct}%`;
  $("sBar").style.width = `${p.ocupacao_pct}%`;
  $("raw").textContent = JSON.stringify(p, null, 2);
  lastMsg = Date.now(); updateLast();
}
function updateLast() {
  if (!lastMsg) return;
  const s = Math.round((Date.now() - lastMsg) / 1000);
  const old = mode === "live" && Date.now() - lastMsg > STALE_MS;
  $("lastTxt").textContent = old ? `Atenção: sem dados há ${s} s` : `Atualizado há ${s} s`;
}
setInterval(updateLast, 1000);

// ===== Modo simulação: gera o mesmo JSON que o ESP32 publicaria =====
function publishSim() {
  const livres = sim.filter(o => !o).length;
  render({
    total_vagas: 4, vagas_livres: livres, pcd_livre: !sim[0],
    ocupacao_pct: Math.round((4 - livres) * 100 / 4),
    vagas: sim.map((o, i) => ({
      id: i + 1, tipo: TIPOS[i], status: o ? "OCUPADA" : "LIVRE",
      dist_cm: o ? +(15 + Math.random() * 25).toFixed(1) : +(80 + Math.random() * 120).toFixed(1)
    })),
    timestamp_ms: Date.now() % 100000000
  });
}

// ===== Modo ao vivo: assina o tópico MQTT =====
function setConn(txt, cls) { $("connTxt").textContent = txt; $("dot").className = "dot " + (cls || ""); }
function connectLive() {
  if (typeof mqtt === "undefined") { setConn("Biblioteca MQTT não carregou (sem internet?)", "err"); return; }
  setConn("Conectando ao broker...");
  client = mqtt.connect(BROKER_WS, { clientId: "painel_web_" + Math.random().toString(16).slice(2, 8), reconnectPeriod: 3000 });
  client.on("connect", () => { setConn("Conectado ao broker · aguardando o ESP32", "on"); client.subscribe(TOPIC); });
  client.on("reconnect", () => setConn("Reconectando..."));
  client.on("error", () => setConn("Erro de conexão com o broker", "err"));
  client.on("close", () => setConn("Desconectado do broker", "err"));
  client.on("message", (_, msg) => {
    try { if (mode === "live") { render(JSON.parse(msg.toString())); setConn("Conectado · recebendo dados do ESP32", "on"); } }
    catch (e) { console.error("Payload inválido", e); }
  });
}
function disconnectLive() { if (client) { client.end(true); client = null; } }

// ===== Troca de modo =====
function setMode(m) {
  mode = m;
  $("btnLive").setAttribute("aria-pressed", m === "live");
  $("btnSim").setAttribute("aria-pressed", m === "sim");
  TIPOS.forEach((_, i) => $("bay" + i).classList.toggle("sim", m === "sim"));
  if (m === "sim") {
    disconnectLive(); setConn("Modo simulação (sem broker)", "");
    $("hint").textContent = "Clique em uma vaga para estacionar ou liberar o carro.";
    publishSim();
  } else {
    $("hint").textContent = "Mostrando o que o ESP32 publica no tópico " + TOPIC + ".";
    $("raw").textContent = "Aguardando dados..."; lastMsg = 0; $("lastTxt").textContent = "Nenhuma mensagem recebida ainda";
    connectLive();
  }
}
$("btnLive").onclick = () => setMode("live");
$("btnSim").onclick  = () => setMode("sim");

buildBays();
setMode("live");
</script>
</body>
</html>
